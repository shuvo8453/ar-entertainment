<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
    <defs>
        <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF1E27" />
            <stop offset="100%" stop-color="#B30006" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700" />
            <stop offset="100%" stop-color="#FFA500" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Logo Icon / Clapperboard badge -->
    <g transform="translate(10, 8)">
        <!-- Film Strip / Clapper Icon -->
        <rect x="0" y="4" width="60" height="56" rx="10" fill="url(#arGrad)" filter="url(#glow)" />
        <rect x="4" y="8" width="52" height="14" rx="4" fill="#111111" />
        <!-- Clapper Stripes -->
        <polygon points="10,8 18,8 14,22 6,22" fill="#FFFFFF" />
        <polygon points="24,8 32,8 28,22 20,22" fill="#FFFFFF" />
        <polygon points="38,8 46,8 42,22 34,22" fill="#FFFFFF" />
        <!-- Play / Cinema Triangle -->
        <polygon points="24,30 24,52 44,41" fill="#FFFFFF" />
    </g>

    <!-- AR Typography -->
    <text x="80" y="48" font-family="'Plus Jakarta Sans', 'Raleway', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="1">AR</text>
    
    <!-- Red Accent Dot / Star -->
    <circle cx="152" cy="40" r="5" fill="#FF1E27" />

    <!-- ENTERTAINMENT Typography -->
    <text x="165" y="48" font-family="'Plus Jakarta Sans', 'Raleway', 'Helvetica Neue', sans-serif" font-size="21" font-weight="800" fill="#E5E5E5" letter-spacing="4">ENTERTAINMENT</text>
    
    <!-- Tagline -->
    <text x="82" y="66" font-family="'Roboto', 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="url(#goldGrad)" letter-spacing="2.8">FILM &bull; TVC &bull; FIXER &bull; AI PRODUCTION</text>
</svg>
